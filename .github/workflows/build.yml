name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Build native Windows app and updater
        shell: pwsh
        run: |
          go build -ldflags='-s -w -H=windowsgui' -o Workbench.exe ./cmd/workbench
          go build -ldflags='-s -w -H=windowsgui' -o Workbench-Updater.exe ./cmd/workbench-updater
      - uses: actions/upload-artifact@v4
        with:
          name: Workbench-Windows-amd64
          path: |
            Workbench.exe
            Workbench-Updater.exe
