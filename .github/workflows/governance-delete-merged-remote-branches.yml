name: governance-delete-merged-remote-branches

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: governance-delete-merged-remote-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'mattbrownsett' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'governance/execute-final-cleanup-20260821')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out current main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact control merge and zero open pull requests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          operation_commit="$(git rev-parse refs/remotes/origin/main)"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            expected_merge="${{ github.event.pull_request.merge_commit_sha }}"
            if [ -z "$expected_merge" ] || [ "$operation_commit" != "$expected_merge" ]; then
              printf 'error=control-merge-is-not-current-main expected=%s actual=%s\n' "$expected_merge" "$operation_commit" >&2
              exit 1
            fi
          fi
          count="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq 'length' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$count" -ne 0 ]; then
            printf 'error=open-pull-requests-present count=%s\n' "$count" >&2
            exit 1
          fi
          printf 'open_pull_requests=0\n'
          printf 'operation_commit=%s\n' "$operation_commit" >> "$GITHUB_ENV"

      - name: Delete only fully merged remote branches
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          WORKBENCH_OPERATION_COMMIT="$operation_commit" bash scripts/ops/governance-delete-merged-remote-branches.sh "$GITHUB_WORKSPACE" confirmed-no-open-prs

      - name: Prove only main remains
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | LC_ALL=C sort | grep -v '^HEAD$' || true)
          printf 'remote_branches=%s\n' "${branches[*]:-}"
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != 'main' ]; then
            printf 'error=unexpected-remote-branch-namespace\n' >&2
            exit 1
          fi

      - name: Publish successful cleanup evidence
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --title 'Governance cleanup result: success' --body "governance_cleanup=success\noperation_commit=$operation_commit\nremote_branches=main"

      - name: Publish failed cleanup evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set -u
          gh issue create --title 'Governance cleanup result: failed' --body "governance_cleanup=failed\nworkflow_event=${{ github.event_name }}\nNo further destructive attempt is permitted until this failure is inspected." || true
