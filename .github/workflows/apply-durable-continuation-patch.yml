name: apply-durable-continuation-patch

on:
  push:
    branches:
      - fix/durable-development-continuation-20260820

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - name: Apply and verify focused patch
        run: |
          git apply .workbench/durable-continuation-main.patch
          gofmt -w cmd/workbench-relay/main.go cmd/workbench-relay/private_continuation.go internal/core/private_relay_continuation.go internal/core/private_relay_continuation_test.go internal/core/task_execution.go internal/core/task_modes.go
          go test ./internal/core ./cmd/workbench-relay
      - name: Commit verified source and remove bootstrap files
        run: |
          rm .workbench/durable-continuation-main.patch .github/workflows/apply-durable-continuation-patch.yml
          git add -A
          git -c user.name='Workbench Patch Automation' -c user.email='workbench-patch@users.noreply.github.com' commit -m 'Enable durable private relay development continuation'
          git push origin HEAD:fix/durable-development-continuation-20260820
