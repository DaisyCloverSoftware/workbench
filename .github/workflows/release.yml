name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - name: Resolve release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path internal/core/version.go -Pattern 'const Version = "([^"]+)"'
          if (-not $match) { throw 'Could not read Workbench version.' }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Workbench version: $version" }
          $tag = "v$version"
          "WORKBENCH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORKBENCH_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            "WORKBENCH_RELEASE_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($response.StatusCode -eq 404) {
            "WORKBENCH_RELEASE_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            throw "GitHub release lookup returned HTTP $($response.StatusCode)."
          }
      - name: Test
        if: env.WORKBENCH_RELEASE_EXISTS != 'true'
        run: go test ./...
      - name: Build release assets
        if: env.WORKBENCH_RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          go build -ldflags='-s -w -H=windowsgui' -o Workbench.exe ./cmd/workbench
          (Get-FileHash -Algorithm SHA256 Workbench.exe).Hash.ToLower() + '  Workbench.exe' | Set-Content -Encoding ascii Workbench.exe.sha256
          go build -ldflags='-s -w -H=windowsgui' -o Workbench-Updater.exe ./cmd/workbench-updater
          (Get-FileHash -Algorithm SHA256 Workbench-Updater.exe).Hash.ToLower() + '  Workbench-Updater.exe' | Set-Content -Encoding ascii Workbench-Updater.exe.sha256

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o workbench-runner-linux-amd64 ./cmd/workbench-runner
          go build -trimpath -ldflags='-s -w' -o workbench-server-linux-amd64 ./cmd/workbench-server
          go build -trimpath -ldflags='-s -w' -o workbench-relay-linux-amd64 ./cmd/workbench-relay
          Remove-Item Env:GOOS -ErrorAction SilentlyContinue
          Remove-Item Env:GOARCH -ErrorAction SilentlyContinue
          Remove-Item Env:CGO_ENABLED -ErrorAction SilentlyContinue

          Compress-Archive -Path workbench-runner-linux-amd64,workbench-server-linux-amd64,workbench-relay-linux-amd64 -DestinationPath Workbench-Cluster-linux-amd64.zip
          (Get-FileHash -Algorithm SHA256 Workbench-Cluster-linux-amd64.zip).Hash.ToLower() + '  Workbench-Cluster-linux-amd64.zip' | Set-Content -Encoding ascii Workbench-Cluster-linux-amd64.zip.sha256
      - name: Publish GitHub release
        if: env.WORKBENCH_RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:WORKBENCH_TAG Workbench.exe Workbench.exe.sha256 Workbench-Updater.exe Workbench-Updater.exe.sha256 Workbench-Cluster-linux-amd64.zip Workbench-Cluster-linux-amd64.zip.sha256 --target '${{ github.sha }}' --title "Workbench $env:WORKBENCH_TAG" --generate-notes
