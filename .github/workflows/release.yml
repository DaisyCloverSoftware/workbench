name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Build native Windows app
        shell: pwsh
        run: |
          go build -ldflags='-s -w -H=windowsgui' -o Workbench.exe ./cmd/workbench
          (Get-FileHash -Algorithm SHA256 Workbench.exe).Hash.ToLower() + '  Workbench.exe' | Set-Content -Encoding ascii Workbench.exe.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' Workbench.exe Workbench.exe.sha256 --title 'Workbench ${{ github.ref_name }}' --generate-notes
