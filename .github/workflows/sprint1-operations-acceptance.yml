name: sprint1-operations-acceptance

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - 'internal/desktop/**'
      - '.github/workflows/sprint1-operations-acceptance.yml'
      - '.github/workflows/sprint1-operational-telemetry.yml'

permissions:
  contents: read

jobs:
  base-operations-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - name: Verify canonical Sprint 1 operations behavior
        shell: pwsh
        run: go test ./internal/core ./internal/desktop
      - name: Build production Workbench
        shell: pwsh
        run: go build -ldflags='-s -w -H=windowsgui' -o Workbench-Sprint1-Acceptance.exe ./cmd/workbench
      - name: Acceptance ownership
        shell: pwsh
        run: |
          Write-Host 'Base Sprint 1 scheduler, lane/state invariants, priority control, waiting/Needs You and recent-outcome regressions are covered by the core/desktop suites.'
          Write-Host 'The actual multi-job Windows UI demonstration is consolidated in sprint1-operational-telemetry.'
