name: sprint1-operations-acceptance

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - 'internal/desktop/**'
      - '.github/workflows/sprint1-operations-acceptance.yml'

permissions:
  contents: read

jobs:
  operations-acceptance:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - name: Run Operations model and scheduler checks
        shell: pwsh
        run: go test ./internal/core ./internal/desktop

      - name: Build production app and deterministic acceptance harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $harnessSource = Join-Path $env:RUNNER_TEMP 'sprint1-harness.go'
          @'
          package main

          import (
              "encoding/json"
              "fmt"
              "os"
              "strings"
              "time"
          )

          type job struct {
              Version int    `json:"version"`
              TaskID  string `json:"task_id"`
              Intent  string `json:"intent"`
          }

          func main() {
              var j job
              if err := json.NewDecoder(os.Stdin).Decode(&j); err != nil {
                  os.Exit(2)
              }
              switch {
              case strings.Contains(j.Intent, "Acceptance running hold"):
                  time.Sleep(15 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"completed\",\"report\":\"Acceptance hold completed.\"}\n", j.TaskID)
              case strings.Contains(j.Intent, "Acceptance queue target"):
                  time.Sleep(8 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"failed\",\"report\":\"Intentional Sprint 1 acceptance failure.\",\"category\":\"adapter\",\"retryable\":false}\n", j.TaskID)
              default:
                  time.Sleep(20 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"completed\",\"report\":\"Acceptance queued job completed.\"}\n", j.TaskID)
              }
          }
          '@ | Set-Content -Encoding UTF8 $harnessSource
          go build -o (Join-Path $env:RUNNER_TEMP 'Sprint1Harness.exe') $harnessSource
          go build -ldflags='-s -w -H=windowsgui' -o (Join-Path $env:RUNNER_TEMP 'Workbench-Sprint1.exe') ./cmd/workbench

      - name: Demonstrate live Operations dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'sprint1-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sprint1-localappdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $stateDir = Join-Path $env:APPDATA 'Workbench'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $statePath = Join-Path $stateDir 'state.json'
          $adapterPath = Join-Path $env:RUNNER_TEMP 'Sprint1Harness.exe'
          $exePath = Join-Path $env:RUNNER_TEMP 'Workbench-Sprint1.exe'
          $projectPath = $pwd.Path
          $now = [DateTime]::UtcNow
          $future = $now.AddHours(1)

          $state = [ordered]@{
            version = 3
            active_project_id = 'acceptance-project'
            project_path = $projectPath
            notes = 'Sprint 1 Operations acceptance fixture.'
            projects = @(
              [ordered]@{id='acceptance-project'; path=$projectPath; name='Workbench Acceptance'; notes='Operations dashboard acceptance project.'; pinned=$true; added_at=$now.AddDays(-1).ToString('o'); last_used_at=$now.ToString('o')}
            )
            tasks = @(
              [ordered]@{id='acceptance-wait-retry'; created_at=$now.AddMinutes(-18).ToString('o'); updated_at=$now.AddMinutes(-6).ToString('o'); origin='ci-acceptance'; title='Retry transient provider outage'; intent='Retry the acceptance provider after cooldown'; project_path=$projectPath; status='waiting_retry'; route_reason='waiting for a transient provider cooldown'; retry_at=$future.ToString('o'); auto_retry_count=1; consumes_work=$false},
              [ordered]@{id='acceptance-wait-ci'; created_at=$now.AddMinutes(-25).ToString('o'); updated_at=$now.AddMinutes(-2).ToString('o'); origin='ci-acceptance'; title='Wait for acceptance CI'; intent='Continue after required acceptance CI'; project_path=$projectPath; status='waiting_dependency'; route_reason='waiting on an external dependency in the background'; consumes_work=$false; dependency=[ordered]@{kind='github_actions'; reason='required acceptance CI'; repository='DaisyCloverSoftware/workbench'; run_id=987654; state='in_progress'; check_count=2; started_at=$now.AddMinutes(-15).ToString('o'); last_checked_at=$now.AddMinutes(-2).ToString('o'); next_check_at=$future.ToString('o') }},
              [ordered]@{id='acceptance-needs'; created_at=$now.AddMinutes(-12).ToString('o'); updated_at=$now.AddMinutes(-3).ToString('o'); origin='ci-acceptance'; title='Approve acceptance deployment target'; intent='Prepare the acceptance deployment'; project_path=$projectPath; status='needs_attention'; attention_question='Approve the Sprint 1 acceptance deployment target?'; consumes_work=$false},
              [ordered]@{id='acceptance-completed'; created_at=$now.AddHours(-1).ToString('o'); updated_at=$now.AddMinutes(-8).ToString('o'); origin='ci-acceptance'; title='Previous acceptance success'; intent='Exercise recent success history'; project_path=$projectPath; status='completed'; provider_id='structured-harness'; output='Previous acceptance success completed.'; consumes_work=$false},
              [ordered]@{id='acceptance-failed'; created_at=$now.AddHours(-1).ToString('o'); updated_at=$now.AddMinutes(-7).ToString('o'); origin='ci-acceptance'; title='Previous acceptance failure'; intent='Exercise recent failure history'; project_path=$projectPath; status='failed'; error='Intentional stored acceptance failure.'; consumes_work=$false}
            )
            secrets = @()
            preferences = [ordered]@{avoid_work_usage=$true; allow_metered_api=$false; autonomy_mode='trusted-repo'; harness_adapter_path=$adapterPath; mcp_port=18941; mcp_token='sprint1-acceptance-local-token'}
          }
          $state | ConvertTo-Json -Depth 14 | Set-Content -Encoding UTF8 $statePath

          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class WorkbenchSprint1 {
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr hWnd, int id);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr hWnd);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutPtr(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam, uint flags, uint timeout, out UIntPtr result);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutString(IntPtr hWnd, uint msg, IntPtr wParam, string lParam, uint flags, uint timeout, out UIntPtr result);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutBuffer(IntPtr hWnd, uint msg, IntPtr wParam, StringBuilder lParam, uint flags, uint timeout, out UIntPtr result);
          }
          '@

          function Get-Control([System.Diagnostics.Process]$process, [int]$id) {
            $control = [WorkbenchSprint1]::GetDlgItem($process.MainWindowHandle, $id)
            if ($control -eq [IntPtr]::Zero) { throw "Missing Workbench control $id." }
            return $control
          }

          function Send-Bounded([IntPtr]$handle, [uint32]$msg, [IntPtr]$wParam, [IntPtr]$lParam, [string]$label) {
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1]::SendMessageTimeoutPtr($handle, $msg, $wParam, $lParam, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label did not return within 2 seconds." }
            return [uint64]$result.ToUInt64()
          }

          function Set-BoundedText([IntPtr]$handle, [string]$text, [string]$label) {
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1]::SendMessageTimeoutString($handle, 0x000C, [IntPtr]::Zero, $text, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label text update did not return within 2 seconds." }
          }

          function Get-BoundedText([IntPtr]$handle, [string]$label) {
            $length = [int](Send-Bounded $handle 0x000E ([IntPtr]::Zero) ([IntPtr]::Zero) "$label text length")
            $builder = New-Object System.Text.StringBuilder ([Math]::Max(2, $length + 2))
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1]::SendMessageTimeoutBuffer($handle, 0x000D, [IntPtr]$builder.Capacity, $builder, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label text read did not return within 2 seconds." }
            return $builder.ToString()
          }

          function Click-Control([System.Diagnostics.Process]$process, [int]$id) {
            $control = Get-Control $process $id
            [void](Send-Bounded $control 0x00F5 ([IntPtr]::Zero) ([IntPtr]::Zero) "button $id")
            Start-Sleep -Milliseconds 180
          }

          function Get-ListLines([IntPtr]$list) {
            $count = [int](Send-Bounded $list 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'list count')
            $lines = @()
            for ($i = 0; $i -lt $count; $i++) {
              $length = [int](Send-Bounded $list 0x018A ([IntPtr]$i) ([IntPtr]::Zero) "list text length $i")
              $builder = New-Object System.Text.StringBuilder ([Math]::Max(2, $length + 2))
              $result = [UIntPtr]::Zero
              $sent = [WorkbenchSprint1]::SendMessageTimeoutBuffer($list, 0x0189, [IntPtr]$i, $builder, 2, 2000, [ref]$result)
              if ($sent -eq [IntPtr]::Zero) { throw "list text $i did not return within 2 seconds." }
              $lines += $builder.ToString()
            }
            return $lines
          }

          function Select-ListLine([System.Diagnostics.Process]$process, [int]$id, [string]$needle) {
            $list = Get-Control $process $id
            $lines = @(Get-ListLines $list)
            $index = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -like "*$needle*") { $index = $i; break }
            }
            if ($index -lt 0) { throw "Could not find '$needle' in control $id. Lines: $($lines -join ' | ')" }
            [void](Send-Bounded $list 0x0186 ([IntPtr]$index) ([IntPtr]::Zero) "select list line $index")
            $command = [IntPtr]($id -bor (1 -shl 16))
            [void](Send-Bounded $process.MainWindowHandle 0x0111 $command $list "selection command $id")
            Start-Sleep -Milliseconds 180
          }

          function Read-State { return (Get-Content -Raw $statePath | ConvertFrom-Json) }

          function Wait-Until([scriptblock]$condition, [string]$description, [int]$seconds = 30) {
            $deadline = [DateTime]::UtcNow.AddSeconds($seconds)
            do {
              if (& $condition) { return }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "Timed out waiting for $description."
          }

          function Delegate-Intent([System.Diagnostics.Process]$process, [string]$intent) {
            Set-BoundedText (Get-Control $process 3111) $intent 'delegate intent'
            Click-Control $process 3112
          }

          $evidence = New-Object System.Collections.Generic.List[string]
          $p = Start-Process -FilePath $exePath -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 200
              $p.Refresh()
            } while ($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and [DateTime]::UtcNow -lt $deadline)
            if ($p.HasExited -or $p.MainWindowHandle -eq 0) { throw 'Workbench did not expose its production window.' }

            Click-Control $p 3001
            Delegate-Intent $p 'Acceptance running hold'
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance running hold' -and $_.status -eq 'running'}).Count -eq 1 } 'first acceptance job to enter Running' 25

            1..5 | ForEach-Object { Delegate-Intent $p ("Acceptance older queue {0:D2}" -f $_) }
            Delegate-Intent $p 'Acceptance queue target'
            1..4 | ForEach-Object { Delegate-Intent $p ("Acceptance newer queue {0:D2}" -f $_) }
            Wait-Until { ((Read-State).tasks | Where-Object {$_.status -eq 'queued' -and $_.intent -like 'Acceptance *'}).Count -ge 10 } 'ten queued acceptance jobs' 15

            Click-Control $p 3301
            $aiList = Get-Control $p 3607
            Wait-Until { ([int](Send-Bounded $aiList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'AI lane count')) -ge 11 } 'all concurrent AI jobs to appear on Dashboard' 10
            $evidence.Add('1. queued and running jobs appeared on the Operations dashboard without any page refresh control')

            Select-ListLine $p 3607 'Acceptance queue target'
            $details = Get-Control $p 3614
            Wait-Until { (Get-BoundedText $details 'job details') -match 'Normal priority' -and (Get-BoundedText $details 'job details') -match 'queue #6' } 'initial target queue position #6' 8
            Click-Control $p 3615
            Wait-Until { (Get-BoundedText $details 'job details') -match 'High priority' -and (Get-BoundedText $details 'job details') -match 'queue #1' } 'target to move to queue #1' 8
            $targetState = (Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance queue target'} | Select-Object -First 1
            if ($targetState.priority -ne 2) { throw "Expected durable High priority (2), got $($targetState.priority)." }
            $evidence.Add('2. Priority ↑ changed durable queue priority from Normal/#6 to High/#1')

            $compactCount = [int](Send-Bounded $aiList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'compact AI count')
            if ($compactCount -lt 11) { throw "Expected at least 11 concurrent AI jobs, got $compactCount." }
            Click-Control $p 3606
            $fullList = Get-Control $p 3613
            if (-not [WorkbenchSprint1]::IsWindowVisible($fullList)) { throw 'Full-lane list did not open.' }
            $fullCount = [int](Send-Bounded $fullList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'full AI count')
            if ($fullCount -ne $compactCount) { throw "Full lane count $fullCount did not match compact lane count $compactCount." }
            $evidence.Add("3. compact lane held $compactCount jobs and Open all exposed the same complete list with selectable jobs")
            Click-Control $p 3612

            # Dashboard stays open here. Engine notifications must move the selected
            # item from Queued to Running without a navigation or manual refresh.
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance queue target' -and $_.status -eq 'running'}).Count -eq 1 } 'reprioritised target to enter Running' 35
            Wait-Until { ((Get-ListLines $aiList) | Where-Object {$_ -like '*Acceptance queue target*' -and $_ -like '*WORKING*'}).Count -eq 1 } 'already-open dashboard to show target Running' 10
            $runningDetails = Get-BoundedText $details 'running details'
            if ($runningDetails -notmatch 'Assigned worker: structured-harness' -or $runningDetails -notmatch 'Start / elapsed:' -or $runningDetails -notmatch 'deterministic percentage unavailable') { throw "Running drill-down was incomplete: $runningDetails" }
            $olderQueued = ((Read-State).tasks | Where-Object {$_.intent -like 'Acceptance older queue *' -and $_.status -eq 'queued'}).Count
            if ($olderQueued -lt 1) { throw 'Older normal-priority work did not remain queued behind the promoted target.' }
            $evidence.Add('4. promoted job became the next Running job while older Normal work remained queued; no Dashboard refresh/navigation occurred')
            $evidence.Add('5. running drill-down exposed worker, start/elapsed and explicit indeterminate stage progress without a fabricated percentage')

            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance queue target' -and $_.status -eq 'failed'}).Count -eq 1 } 'target to fail' 20
            Wait-Until { (Get-BoundedText $details 'failed details') -match 'Failure:' } 'selected job to show failure automatically' 10
            $recentList = Get-Control $p 3624
            Wait-Until { ((Get-ListLines $recentList) | Where-Object {$_ -like '*FAILED*Acceptance queue target*'}).Count -eq 1 } 'failed target in recent outcomes' 10
            Wait-Until { ((Get-ListLines $recentList) | Where-Object {$_ -like '*COMPLETED*Acceptance running hold*'}).Count -eq 1 } 'completed hold in recent outcomes' 10
            $evidence.Add('6. failed job exposed its failure and moved into Recent outcomes')
            $evidence.Add('7. completed job moved into Recent outcomes')

            Select-ListLine $p 3609 'Wait for acceptance CI'
            $waitingText = Get-BoundedText $details 'waiting details'
            if ($waitingText -notmatch 'Waiting for:' -or $waitingText -notmatch 'GitHub Actions' -or $waitingText -notmatch 'Waiting elapsed:' -or $waitingText -notmatch 'Automatic retry / check: Yes') { throw "Waiting drill-down was incomplete: $waitingText" }
            $evidence.Add('8. Waiting exposed its GitHub Actions reason, elapsed wait and automatic re-check status')

            Select-ListLine $p 3611 'Approve acceptance deployment target'
            $needsText = Get-BoundedText $details 'needs-you details'
            if ($needsText -notmatch 'Owner action:' -or $needsText -notmatch 'Approve the Sprint 1 acceptance deployment target') { throw "Needs You drill-down was incomplete: $needsText" }
            if (-not [WorkbenchSprint1]::IsWindowEnabled((Get-Control $p 3617))) { throw 'Needs You Open task action was not enabled.' }
            Click-Control $p 3617
            if (-not [WorkbenchSprint1]::IsWindowVisible((Get-Control $p 3114))) { throw 'Open task did not route to Work.' }
            $evidence.Add('9. Needs You stated the required owner decision and Open task routed directly to the task')

            Click-Control $p 3301
            Click-Control $p 3618
            $laneTotal = 0
            foreach ($id in @(3601,3603,3605,3607,3609,3611)) { $laneTotal += [int](Send-Bounded (Get-Control $p $id) 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) "lane $id count") }
            $projectLabel = Get-BoundedText (Get-Control $p 3621) 'project activity label'
            if ($projectLabel -notmatch 'Project activity · (\d+) live jobs') { throw "Could not parse project total from '$projectLabel'." }
            if ([int]$Matches[1] -ne $laneTotal) { throw "Project live count $($Matches[1]) did not reconcile with lane total $laneTotal." }
            $workerLabel = Get-BoundedText (Get-Control $p 3619) 'worker assignment label'
            if ($workerLabel -notmatch 'Worker assignments · (\d+) running') { throw "Could not parse worker total from '$workerLabel'." }
            $evidence.Add("10. canonical project activity reconciled with all lane contents ($laneTotal live jobs), with running worker assignments derived from the same surface")
          } finally {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process Sprint1Harness -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $evidence | Set-Content -Encoding UTF8 (Join-Path $pwd 'Sprint1-Operations-Acceptance-Evidence.txt')
            if (Test-Path $statePath) {
              Copy-Item $statePath (Join-Path $pwd 'Sprint1-Operations-Final-State.json') -Force
            }
          }

          if ($evidence.Count -ne 10) { throw "Acceptance produced $($evidence.Count) evidence lines; expected 10." }
          Get-Content (Join-Path $pwd 'Sprint1-Operations-Acceptance-Evidence.txt')

      - name: Upload Sprint 1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sprint1-Operations-Acceptance
          if-no-files-found: warn
          path: |
            Sprint1-Operations-Acceptance-Evidence.txt
            Sprint1-Operations-Final-State.json