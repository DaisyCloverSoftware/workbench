# Existing-workflow trigger: apply the targeted patch below, then self-remove.
name: sprint1-visible-layout-fix

on:
  push:
    branches:
      - sprint1-operational-telemetry-clean
    paths:
      - '.github/workflows/_sprint1-visible-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: sprint1-operational-telemetry-clean
      - name: Make compact telemetry visibly fit production lanes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          controls = 'internal/desktop/dashboard_operations_controls_windows.go'
          replace_once(controls,
              'setWindowText(s.controls[idOpsDetails], operationsDetailText(detail, time.Now()))',
              'setWindowText(s.controls[idOpsDetails], operationsTelemetryDetailText(detail, time.Now()))')
          replace_once(controls,
              '''func operationsCompactListLine(item core.WorkItem) string {
\tproject := operationsProjectLabel(item)
\tphase := operationsProgressSummary(item.Progress, item.State)
\tif item.State == core.TaskQueued && item.QueuePosition > 0 {
\t\treturn fmt.Sprintf("#%d %s · %s — %s", item.QueuePosition, strings.ToUpper(item.Priority.String()), project, item.Title)
\t}
\treturn fmt.Sprintf("%s · %s — %s · %s", strings.ToUpper(dashboardStatusLabel(item.State, string(item.State))), project, item.Title, phase)
}

func operationsExpandedListLine(item core.WorkItem) string {
\tline := operationsCompactListLine(item)
\tworker := strings.TrimSpace(item.Provider)
\tif worker != "" {
\t\tline += " · " + worker
\t}
\treturn line
}
''',
              '''func operationsCompactListLine(item core.WorkItem) string {
\treturn operationsTelemetryListLine(item, time.Now())
}

func operationsExpandedListLine(item core.WorkItem) string {
\treturn operationsTelemetryExpandedLine(item, time.Now())
}
''')
          replace_once(controls, 'if contentW < 850 || contentH < 620 {', 'if contentW < 720 || contentH < 560 {')
          replace_once(controls, 'resourceH := 164', 'resourceH := 132')
          replace_once(controls,
              '''\tcolGap := 10
\trowGap := 10
\tcolW := (contentW - colGap*2) / 3
\trowH := (boardH - rowGap) / 2
\tfor i, control := range operationsLaneControls {
\t\tcol := i % 3
\t\trow := i / 3
\t\tx := contentX + col*(colW+colGap)
\t\ty := boardY + row*(rowH+rowGap)
\t\tshowWindow(s.controls[control.Header], true)
\t\tshowWindow(s.controls[control.List], true)
\t\tmoveWindow(s.controls[control.Header], x+8, y+5, colW-16, 30)
\t\tmoveWindow(s.controls[control.List], x+10, y+42, colW-20, rowH-50)
\t}
''',
              '''\tcolGap := 10
\trowGap := 8
\tcolW := (contentW - colGap) / 2
\trowH := (boardH - rowGap*2) / 3
\tfor i, control := range operationsLaneControls {
\t\tcol := i % 2
\t\trow := i / 2
\t\tx := contentX + col*(colW+colGap)
\t\ty := boardY + row*(rowH+rowGap)
\t\tshowWindow(s.controls[control.Header], true)
\t\tshowWindow(s.controls[control.List], true)
\t\tmoveWindow(s.controls[control.Header], x+4, y+2, colW-8, 26)
\t\tmoveWindow(s.controls[control.List], x+6, y+32, colW-12, rowH-38)
\t}
''')

          telemetry = 'internal/desktop/dashboard_operations_telemetry_windows.go'
          replace_once(telemetry,
              'return fmt.Sprintf("%s%s · %s · %s · %s", state, queue, task, activity, priority)',
              'return fmt.Sprintf("%s%s · %s · %s · %s", state, queue, priority, activity, task)')
          replace_once(telemetry,
              'return fmt.Sprintf("%s · %s · %s · %s · %s · %s", state, task, progress, runtime, activity, priority)',
              'return fmt.Sprintf("%s · %s · %s · %s · %s · %s", state, progress, runtime, activity, priority, task)')
          replace_once(telemetry,
              'return fmt.Sprintf("%s %d%% %s", telemetryBar(percent, 6), percent, phase)',
              'return fmt.Sprintf("%d%% %s", percent, telemetryBar(percent, 4))')
          replace_once(telemetry,
              'return fmt.Sprintf("Stage %d/%d %s %s", stage, progress.StageTotal, dots, phase)',
              'return fmt.Sprintf("Stage %d/%d %s", stage, progress.StageTotal, dots)')

          tests = 'internal/desktop/dashboard_operations_telemetry_windows_test.go'
          replace_once(tests,
              '[]string{"RUNNING", "Workbench/Verify source", "64%", "Verifying f…", "1m30s elapsed", "8s ago", "HIGH"}',
              '[]string{"RUNNING", "Workbench/Verify source", "64%", "1m30s elapsed", "8s ago", "HIGH"}')
          replace_once(tests,
              '[]string{"RUNNING", "Stage 3/5", "Executing", "22s elapsed", "2s ago", "NORMAL", "●", "○"}',
              '[]string{"RUNNING", "Stage 3/5", "22s elapsed", "2s ago", "NORMAL", "●", "○"}')

          wf = '.github/workflows/sprint1-operational-telemetry.yml'
          replace_once(wf,
              '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);',
              '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);\n            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);')
          replace_once(wf,
              '''            $needs=Get-Control $p 3611

            Wait-Until { ((Get-ListLines $ai)-join "`n") -match '\\d+%' } 'measured percentage in active row' 20
''',
              '''            $needs=Get-Control $p 3611

            Wait-Until { [WBTelemetry]::IsWindowVisible($server) -and [WBTelemetry]::IsWindowVisible($ai) } 'native Operations lanes to be visible' 10
            Wait-Until {
              $laneRect=New-Object WBTelemetry+RECT
              [void][WBTelemetry]::GetWindowRect($ai,[ref]$laneRect)
              ($laneRect.Right-$laneRect.Left) -ge 430
            } 'two-column compact lane width' 10
            Wait-Until { ((Get-ListLines $ai)-join "`n") -match '\\d+%' } 'measured percentage in active row' 20
''')
          replace_once(wf,
              '''            if($after -notmatch '\\d+s elapsed' -or $after -notmatch '\\d+s ago'){throw "Runtime/activity missing: $after"}
            if($after -match 'percentage unavailable'){throw "Unacceptable unavailable-percentage text: $after"}
''',
              '''            if($after -notmatch '\\d+s elapsed' -or $after -notmatch '\\d+s ago'){throw "Runtime/activity missing: $after"}
            if($after -match 'percentage unavailable'){throw "Unacceptable unavailable-percentage text: $after"}
            $taskPos=$after.IndexOf('Workb')
            foreach($token in @('%','elapsed','ago','NORMAL')) {
              $tokenPos=$after.IndexOf($token)
              if($tokenPos -lt 0 -or $taskPos -lt 0 -or $tokenPos -gt $taskPos){throw "Operational field '$token' was not placed before the long task label: $after"}
            }
''')
          replace_once(wf,
              "$evidence.Add('4. Running rows exposed elapsed runtime, latest activity age, state and named priority without selecting a task.')",
              "$evidence.Add('4. Two-column compact lanes kept state, progress, elapsed runtime, latest activity age and named priority ahead of long task labels without selection.')")
          PY
          git rm .github/workflows/_sprint1-visible-layout-fix.yml
          git add -A
          git config user.name 'workbench-sprint1-bot'
          git config user.email 'workbench-sprint1-bot@users.noreply.github.com'
          git commit -m 'Make compact Operations telemetry visibly fit'
          git push origin HEAD:sprint1-operational-telemetry-clean
