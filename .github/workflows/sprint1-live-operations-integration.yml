name: sprint1-live-operations-integration

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - 'internal/desktop/**'
      - '.github/workflows/sprint1-live-operations-integration.yml'
      - '.github/workflows/sprint1-operational-telemetry.yml'

permissions:
  contents: read

jobs:
  operations-integration-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - name: Run full repository regression suite
        shell: pwsh
        run: go test ./...
      - name: Build actual production Workbench
        shell: pwsh
        run: go build -ldflags='-s -w -H=windowsgui' -o Workbench-Sprint1-Live.exe ./cmd/workbench
      - name: Integration ownership
        shell: pwsh
        run: |
          Write-Host 'The production build and full repository suite remain a dedicated Sprint 1 integration gate.'
          Write-Host 'The live multi-operation dashboard workload, telemetry updates, reprioritisation and screenshot proof are consolidated in sprint1-operational-telemetry.'
