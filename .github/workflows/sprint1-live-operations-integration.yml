name: sprint1-live-operations-integration

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - 'internal/desktop/**'
      - '.github/workflows/sprint1-live-operations-integration.yml'

permissions:
  contents: read

jobs:
  live-operations:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - name: Run Sprint 1 regression checks
        shell: pwsh
        run: go test ./internal/core ./internal/desktop

      - name: Build production app and deterministic real providers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $harnessSource = Join-Path $env:RUNNER_TEMP 'sprint1-live-harness.go'
          @'
          package main

          import (
              "encoding/json"
              "fmt"
              "os"
              "strings"
              "time"
          )

          type job struct {
              Version int    `json:"version"`
              TaskID  string `json:"task_id"`
              Intent  string `json:"intent"`
          }

          func main() {
              var j job
              if err := json.NewDecoder(os.Stdin).Decode(&j); err != nil {
                  os.Exit(2)
              }
              switch {
              case strings.Contains(j.Intent, "Acceptance development hold"):
                  time.Sleep(20 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"completed\",\"report\":\"Development hold completed through the real Workbench worker path.\"}\n", j.TaskID)
              case strings.Contains(j.Intent, "Acceptance priority target"):
                  time.Sleep(5 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"failed\",\"report\":\"Intentional Sprint 1 live acceptance failure.\",\"category\":\"adapter\",\"retryable\":false}\n", j.TaskID)
              case strings.Contains(j.Intent, "Acceptance needs you"):
                  time.Sleep(4 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"needs_attention\",\"attention\":\"Choose the Sprint 1 live acceptance owner action.\"}\n", j.TaskID)
              default:
                  time.Sleep(30 * time.Second)
                  fmt.Printf("{\"version\":1,\"task_id\":%q,\"status\":\"completed\",\"report\":\"Queued acceptance job completed.\"}\n", j.TaskID)
              }
          }
          '@ | Set-Content -Encoding UTF8 $harnessSource
          go build -o (Join-Path $env:RUNNER_TEMP 'Sprint1LiveHarness.exe') $harnessSource

          $openClawSource = Join-Path $env:RUNNER_TEMP 'sprint1-live-openclaw.go'
          @'
          package main

          import (
              "fmt"
              "os"
              "time"
          )

          func main() {
              if len(os.Args) >= 3 && os.Args[1] == "sessions" && os.Args[2] == "archive" {
                  return
              }
              time.Sleep(28 * time.Second)
              fmt.Println("Acceptance operations hold completed through the real Workbench OpenClaw operations path.")
              fmt.Println("WORKBENCH_OPERATION_COMPLETE: verified")
          }
          '@ | Set-Content -Encoding UTF8 $openClawSource
          go build -o (Join-Path $env:RUNNER_TEMP 'openclaw.exe') $openClawSource

          go build -ldflags='-s -w -H=windowsgui' -o (Join-Path $env:RUNNER_TEMP 'Workbench-Sprint1-Live.exe') ./cmd/workbench

      - name: Demonstrate canonical live Operations state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing

          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'sprint1-live-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sprint1-live-localappdata'
          $env:PATH = "$env:RUNNER_TEMP;$env:PATH"
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $stateDir = Join-Path $env:APPDATA 'Workbench'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $statePath = Join-Path $stateDir 'state.json'
          $adapterPath = Join-Path $env:RUNNER_TEMP 'Sprint1LiveHarness.exe'
          $exePath = Join-Path $env:RUNNER_TEMP 'Workbench-Sprint1-Live.exe'
          $projectPath = $pwd.Path
          $now = [DateTime]::UtcNow

          # Only project/preferences are seeded. Every acceptance job below is
          # created by the running Workbench UI and then driven by Engine,
          # scheduler and real provider adapters; no fake Dashboard rows exist.
          $state = [ordered]@{
            version = 3
            active_project_id = 'live-acceptance-project'
            project_path = $projectPath
            notes = 'Sprint 1 live Operations integration acceptance.'
            projects = @(
              [ordered]@{id='live-acceptance-project'; path=$projectPath; name='Workbench Live Acceptance'; notes='Real Engine workload only.'; pinned=$true; added_at=$now.AddDays(-1).ToString('o'); last_used_at=$now.ToString('o')}
            )
            tasks = @()
            secrets = @()
            preferences = [ordered]@{avoid_work_usage=$true; allow_metered_api=$false; autonomy_mode='trusted-repo'; harness_adapter_path=$adapterPath; mcp_port=18942; mcp_token='sprint1-live-acceptance-local-token'}
          }
          $state | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 $statePath

          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class WorkbenchSprint1Live {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr hWnd, int id);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint flags);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool RedrawWindow(IntPtr hWnd, IntPtr updateRect, IntPtr updateRegion, uint flags);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutPtr(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam, uint flags, uint timeout, out UIntPtr result);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutString(IntPtr hWnd, uint msg, IntPtr wParam, string lParam, uint flags, uint timeout, out UIntPtr result);
              [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true, EntryPoint="SendMessageTimeoutW")]
              public static extern IntPtr SendMessageTimeoutBuffer(IntPtr hWnd, uint msg, IntPtr wParam, StringBuilder lParam, uint flags, uint timeout, out UIntPtr result);
          }
          '@

          function Get-Control([System.Diagnostics.Process]$process, [int]$id) {
            $control = [WorkbenchSprint1Live]::GetDlgItem($process.MainWindowHandle, $id)
            if ($control -eq [IntPtr]::Zero) { throw "Missing Workbench control $id." }
            return $control
          }

          function Send-Bounded([IntPtr]$handle, [uint32]$msg, [IntPtr]$wParam, [IntPtr]$lParam, [string]$label) {
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1Live]::SendMessageTimeoutPtr($handle, $msg, $wParam, $lParam, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label did not return within 2 seconds." }
            return [uint64]$result.ToUInt64()
          }

          function Set-BoundedText([IntPtr]$handle, [string]$text, [string]$label) {
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1Live]::SendMessageTimeoutString($handle, 0x000C, [IntPtr]::Zero, $text, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label text update did not return within 2 seconds." }
          }

          function Get-BoundedText([IntPtr]$handle, [string]$label) {
            $length = [int](Send-Bounded $handle 0x000E ([IntPtr]::Zero) ([IntPtr]::Zero) "$label text length")
            $builder = New-Object System.Text.StringBuilder ([Math]::Max(2, $length + 2))
            $result = [UIntPtr]::Zero
            $sent = [WorkbenchSprint1Live]::SendMessageTimeoutBuffer($handle, 0x000D, [IntPtr]$builder.Capacity, $builder, 2, 2000, [ref]$result)
            if ($sent -eq [IntPtr]::Zero) { throw "$label text read did not return within 2 seconds." }
            return $builder.ToString()
          }

          function Click-Control([System.Diagnostics.Process]$process, [int]$id) {
            $control = Get-Control $process $id
            [void](Send-Bounded $control 0x00F5 ([IntPtr]::Zero) ([IntPtr]::Zero) "button $id")
            Start-Sleep -Milliseconds 180
          }

          function Get-ListLines([IntPtr]$list) {
            $count = [int](Send-Bounded $list 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'list count')
            $lines = @()
            for ($i = 0; $i -lt $count; $i++) {
              $length = [int](Send-Bounded $list 0x018A ([IntPtr]$i) ([IntPtr]::Zero) "list text length $i")
              $builder = New-Object System.Text.StringBuilder ([Math]::Max(2, $length + 2))
              $result = [UIntPtr]::Zero
              $sent = [WorkbenchSprint1Live]::SendMessageTimeoutBuffer($list, 0x0189, [IntPtr]$i, $builder, 2, 2000, [ref]$result)
              if ($sent -eq [IntPtr]::Zero) { throw "list text $i did not return within 2 seconds." }
              $lines += $builder.ToString()
            }
            return $lines
          }

          function Select-ListLine([System.Diagnostics.Process]$process, [int]$id, [string]$needle) {
            $list = Get-Control $process $id
            $lines = @(Get-ListLines $list)
            $index = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -like "*$needle*") { $index = $i; break }
            }
            if ($index -lt 0) { throw "Could not find '$needle' in control $id. Lines: $($lines -join ' | ')" }
            [void](Send-Bounded $list 0x0186 ([IntPtr]$index) ([IntPtr]::Zero) "select list line $index")
            $command = [IntPtr]($id -bor (1 -shl 16))
            [void](Send-Bounded $process.MainWindowHandle 0x0111 $command $list "selection command $id")
            Start-Sleep -Milliseconds 180
          }

          function Read-State { return (Get-Content -Raw $statePath | ConvertFrom-Json) }

          function Wait-Until([scriptblock]$condition, [string]$description, [int]$seconds = 30) {
            $deadline = [DateTime]::UtcNow.AddSeconds($seconds)
            do {
              if (& $condition) { return }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "Timed out waiting for $description."
          }

          function Delegate-Intent([System.Diagnostics.Process]$process, [string]$intent) {
            Set-BoundedText (Get-Control $process 3111) $intent 'delegate intent'
            Click-Control $process 3112
          }

          function Save-Window([System.Diagnostics.Process]$process, [string]$name) {
            $process.Refresh()
            [void][WorkbenchSprint1Live]::SetForegroundWindow($process.MainWindowHandle)
            [void][WorkbenchSprint1Live]::RedrawWindow($process.MainWindowHandle, [IntPtr]::Zero, [IntPtr]::Zero, 0x0185)
            Start-Sleep -Milliseconds 250
            $rect = New-Object WorkbenchSprint1Live+RECT
            if (-not [WorkbenchSprint1Live]::GetWindowRect($process.MainWindowHandle, [ref]$rect)) { throw 'GetWindowRect failed.' }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            $bitmap = New-Object System.Drawing.Bitmap($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $hdc = $graphics.GetHdc()
              try {
                if (-not [WorkbenchSprint1Live]::PrintWindow($process.MainWindowHandle, $hdc, 0)) { throw 'PrintWindow failed.' }
              } finally {
                $graphics.ReleaseHdc($hdc)
              }
            } finally {
              $graphics.Dispose()
            }
            $bitmap.Save((Join-Path $pwd $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose()
          }

          $evidence = New-Object System.Collections.Generic.List[string]
          $p = Start-Process -FilePath $exePath -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 200
              $p.Refresh()
            } while ($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and [DateTime]::UtcNow -lt $deadline)
            if ($p.HasExited -or $p.MainWindowHandle -eq 0) { throw 'Workbench did not expose its production window.' }

            Click-Control $p 3001

            Delegate-Intent $p '[workbench:operations] Acceptance operations hold'
            Delegate-Intent $p 'Acceptance development hold'
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -like '*Acceptance operations hold*' -and $_.status -eq 'running'}).Count -eq 1 } 'Server Operations job to enter Running' 20
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance development hold' -and $_.status -eq 'running'}).Count -eq 1 } 'AI Workers job to enter Running' 20

            Delegate-Intent $p 'Acceptance needs you'
            Delegate-Intent $p 'Acceptance older queue'
            Delegate-Intent $p 'Acceptance priority target'
            Delegate-Intent $p 'Acceptance later queue 01'
            Delegate-Intent $p 'Acceptance later queue 02'
            Wait-Until { ((Read-State).tasks | Where-Object {$_.status -eq 'queued' -and $_.intent -like 'Acceptance *'}).Count -eq 5 } 'exactly five queued development jobs' 12

            $waitIntent = 'WORKBENCH_WAIT_GITHUB_ACTIONS:{"repository":"DaisyCloverSoftware/workbench","run_id":987654}' + "`nAcceptance wait for CI"
            Delegate-Intent $p $waitIntent
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance wait for CI' -and $_.status -eq 'waiting_dependency'}).Count -eq 1 } 'real deferred task to enter Waiting' 10

            Click-Control $p 3301
            $serverList = Get-Control $p 3601
            $aiList = Get-Control $p 3607
            $waitingList = Get-Control $p 3609
            $needsList = Get-Control $p 3611
            $details = Get-Control $p 3614
            $recentList = Get-Control $p 3624

            Wait-Until {
              ([int](Send-Bounded $serverList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'Server Ops count')) -eq 1 -and
              ([int](Send-Bounded $aiList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'AI lane count')) -eq 6 -and
              ([int](Send-Bounded $waitingList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'Waiting count')) -eq 1
            } 'live Dashboard to show 2 running, 5 queued and Waiting without refresh' 10
            $workerLabel = Get-BoundedText (Get-Control $p 3619) 'worker assignment label'
            if ($workerLabel -notmatch 'Worker assignments · 2 running') { throw "Expected two running worker assignments, got '$workerLabel'." }
            $evidence.Add('1. Real Workbench tasks appeared without refresh: 2 Running across Server Operations/AI Workers, 5 Queued, and 1 Waiting.')
            $evidence.Add('2. Lane rows/counts and worker assignments updated from the running Engine while Dashboard remained open.')
            Save-Window $p 'Sprint1-Live-2Running-5Queued.png'

            Select-ListLine $p 3607 'Acceptance priority target'
            Wait-Until { (Get-BoundedText $details 'queued target details') -match 'Normal priority' -and (Get-BoundedText $details 'queued target details') -match 'queue #3' } 'target at normal priority queue #3' 8
            if (-not [WorkbenchSprint1Live]::IsWindowEnabled((Get-Control $p 3615))) { throw 'Priority up control was not enabled for queued job.' }
            Click-Control $p 3615
            Wait-Until { (Get-BoundedText $details 'reprioritised target details') -match 'High priority' -and (Get-BoundedText $details 'reprioritised target details') -match 'queue #1' } 'target at high priority queue #1' 8
            $target = (Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance priority target'} | Select-Object -First 1
            if ($target.priority -ne 2) { throw "Durable priority was $($target.priority), expected High (2)." }
            $evidence.Add('3. Priority control was enabled and persisted Normal/#3 -> High/#1 on the real queued task.')

            Click-Control $p 3606
            $fullList = Get-Control $p 3613
            if (-not [WorkbenchSprint1Live]::IsWindowVisible($fullList)) { throw 'Open all did not expose full AI Workers lane.' }
            if ([int](Send-Bounded $fullList 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) 'full lane count') -ne 6) { throw 'Full AI lane did not contain all live jobs.' }
            $evidence.Add('4. Individual jobs were selectable and Open all exposed the complete live lane.')
            Click-Control $p 3612

            # No navigation or refresh from this point: Engine notifications must
            # move the promoted job through Running -> Failed on the open Dashboard.
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance priority target' -and $_.status -eq 'running'}).Count -eq 1 } 'promoted target to become next Running job' 35
            Wait-Until { (Get-BoundedText $details 'running target details') -match 'Implementing' -and (Get-BoundedText $details 'running target details') -match 'deterministic percentage unavailable' } 'open Dashboard to expose meaningful running stage' 10
            $olderQueued = ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance older queue' -and $_.status -eq 'queued'}).Count
            if ($olderQueued -ne 1) { throw 'Older normal-priority job did not remain queued behind promoted target.' }
            $evidence.Add('5. Scheduler consumed the durable priority: promoted target ran before the older Normal job.')
            $evidence.Add('6. Running drill-down showed Implementing plus explicit deterministic-percentage-unavailable progress; no fake percent.')
            Save-Window $p 'Sprint1-Live-Running-Inspection.png'

            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance priority target' -and $_.status -eq 'failed'}).Count -eq 1 } 'priority target to fail' 15
            Wait-Until { (Get-BoundedText $details 'failed target details') -match 'Failure:' } 'failure detail to appear automatically' 8
            Wait-Until { ((Get-ListLines $recentList) | Where-Object {$_ -like '*FAILED*Acceptance priority target*'}).Count -eq 1 } 'failed target in Recent outcomes' 8
            $evidence.Add('7. Failure detail appeared automatically and the failed job entered Recent Outcomes.')

            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance needs you' -and $_.status -eq 'needs_attention'}).Count -eq 1 } 'real worker result to enter Needs You' 20
            Select-ListLine $p 3611 'Acceptance needs you'
            $needsText = Get-BoundedText $details 'Needs You details'
            if ($needsText -notmatch 'Owner action:' -or $needsText -notmatch 'Choose the Sprint 1 live acceptance owner action') { throw "Needs You owner action missing: $needsText" }
            if (-not [WorkbenchSprint1Live]::IsWindowEnabled((Get-Control $p 3617))) { throw 'Open task was not enabled for Needs You.' }
            $evidence.Add('8. A real worker Needs You result exposed the required owner action and direct Open task control.')

            Select-ListLine $p 3609 'Acceptance wait for CI'
            $waitingText = Get-BoundedText $details 'Waiting details'
            if ($waitingText -notmatch 'Waiting for:' -or $waitingText -notmatch 'GitHub Actions' -or $waitingText -notmatch 'Waiting elapsed:' -or $waitingText -notmatch 'Automatic retry / check: Yes') { throw "Waiting detail incomplete: $waitingText" }
            $evidence.Add('9. Real deferred Waiting state showed dependency reason, elapsed time and automatic check behaviour.')

            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -eq 'Acceptance development hold' -and $_.status -eq 'completed'}).Count -eq 1 } 'development hold to complete' 10
            Wait-Until { ((Read-State).tasks | Where-Object {$_.intent -like '*Acceptance operations hold*' -and $_.status -eq 'completed'}).Count -eq 1 } 'operations hold to complete' 20
            Wait-Until { ((Get-ListLines $recentList) | Where-Object {$_ -like '*COMPLETED*Acceptance development hold*'}).Count -eq 1 } 'development completion in Recent outcomes' 8
            Wait-Until { ((Get-ListLines $recentList) | Where-Object {$_ -like '*COMPLETED*Acceptance operations hold*'}).Count -eq 1 } 'operations completion in Recent outcomes' 8
            $evidence.Add('10. Real completed development/operations jobs and failed jobs entered Recent Outcomes automatically.')

            Click-Control $p 3618
            $laneTotal = 0
            foreach ($id in @(3601,3603,3605,3607,3609,3611)) {
              $laneTotal += [int](Send-Bounded (Get-Control $p $id) 0x018B ([IntPtr]::Zero) ([IntPtr]::Zero) "lane $id count")
            }
            $projectLabel = Get-BoundedText (Get-Control $p 3621) 'project activity label'
            if ($projectLabel -notmatch 'Project activity · (\d+) live jobs') { throw "Could not parse project total: '$projectLabel'." }
            if ([int]$Matches[1] -ne $laneTotal) { throw "Project activity $($Matches[1]) != lane total $laneTotal." }
            $workerLabel = Get-BoundedText (Get-Control $p 3619) 'final worker label'
            if ($workerLabel -notmatch 'Worker assignments · (\d+) running') { throw "Could not parse worker total: '$workerLabel'." }
            $stateNow = Read-State
            $runningNow = @($stateNow.tasks | Where-Object {$_.status -eq 'running' -or $_.status -eq 'routing'}).Count
            if ([int]$Matches[1] -ne $runningNow) { throw "Worker assignment count $($Matches[1]) != canonical running state $runningNow." }
            $evidence.Add("11. Lane contents, project activity and worker assignments reconciled with the same durable Engine state ($laneTotal live jobs).")
            Save-Window $p 'Sprint1-Live-Final-Operations.png'
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process Sprint1LiveHarness,openclaw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $evidence | Set-Content -Encoding UTF8 (Join-Path $pwd 'Sprint1-Live-Operations-Evidence.txt')
            if (Test-Path $statePath) { Copy-Item $statePath (Join-Path $pwd 'Sprint1-Live-Final-State.json') -Force }
          }

          if ($evidence.Count -ne 11) { throw "Live acceptance produced $($evidence.Count) evidence lines; expected 11." }
          Get-Content (Join-Path $pwd 'Sprint1-Live-Operations-Evidence.txt')

      - name: Upload live Operations proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sprint1-Live-Operations-Proof
          if-no-files-found: warn
          path: |
            Sprint1-Live-2Running-5Queued.png
            Sprint1-Live-Running-Inspection.png
            Sprint1-Live-Final-Operations.png
            Sprint1-Live-Operations-Evidence.txt
            Sprint1-Live-Final-State.json
