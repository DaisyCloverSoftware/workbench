name: prepare-remote-ops-commit

on:
  push:
    branches:
      - feat/remote-commit-operations-scripts
    paths:
      - .workbench-remote-ops-commit.json

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - name: Wire exact origin commit through the private relay contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'cmd/workbench-relay/private_safe_hands.go',
              '''\t\tvar a struct {\n\t\t\tPath           string   `json:"path"`\n\t\t\tArgs           []string `json:"args,omitempty"`\n\t\t\tTimeoutSeconds int      `json:"timeout_seconds,omitempty"`\n\t\t}\n''',
              '''\t\tvar a struct {\n\t\t\tPath           string   `json:"path"`\n\t\t\tArgs           []string `json:"args,omitempty"`\n\t\t\tCommit         string   `json:"commit,omitempty"`\n\t\t\tTimeoutSeconds int      `json:"timeout_seconds,omitempty"`\n\t\t}\n''')
          replace_once(
              'cmd/workbench-relay/private_safe_hands.go',
              '''\t\tresult, runErr := core.RunOperationsScript(ctx, project, core.OperationsScriptRequest{\n\t\t\tPath:           strings.TrimSpace(a.Path),\n\t\t\tArgs:           a.Args,\n\t\t\tTimeoutSeconds: a.TimeoutSeconds,\n\t\t})\n''',
              '''\t\tresult, runErr := core.RunOperationsScript(ctx, project, core.OperationsScriptRequest{\n\t\t\tPath:           strings.TrimSpace(a.Path),\n\t\t\tArgs:           a.Args,\n\t\t\tCommit:         strings.TrimSpace(a.Commit),\n\t\t\tTimeoutSeconds: a.TimeoutSeconds,\n\t\t})\n''')

          replace_once(
              'cmd/workbench-relay/private_chat_capabilities.go',
              'run_operations_script requires a project and a Git-tracked regular .sh beneath scripts/ops/. Workbench executes the exact HEAD version from a disposable detached worktree using bash with literal argv, never bash -c; dirty checkout edits cannot affect execution. Results include the commit and script SHA-256.',
              'run_operations_script requires a project and a Git-tracked regular .sh beneath scripts/ops/. Without commit, Workbench executes exact local HEAD. With an optional full 40-character commit currently advertised by a credential-free github.com origin branch head, Workbench fetches into a disposable repository and executes that exact commit without moving or modifying the registered checkout. Bash receives literal argv, never bash -c. Results include the commit and script SHA-256.'
          )

          replace_once(
              'skills/workbench/SKILL.md',
              '- Workbench resolves the repository\'s exact HEAD commit, creates a disposable detached worktree at that commit, and runs `bash --noprofile --norc <script> <literal argv...>` from the worktree root. It never accepts `bash -c` or arbitrary shell source as an argument.\n- Dirty edits in the developer checkout cannot affect the executed script.\n',
              '- Without `commit`, Workbench resolves the repository\'s exact local HEAD. When GitHub has a newer reviewed version, pass its full 40-character `commit`; Workbench requires that SHA to be currently advertised by the project\'s credential-free `github.com` origin branch head, fetches it into a disposable repository, and never moves or updates the registered checkout.\n- Workbench creates a detached disposable worktree at the selected commit and runs `bash --noprofile --norc <script> <literal argv...>` from that worktree. It never accepts `bash -c` or arbitrary shell source as an argument. Dirty developer-checkout edits cannot affect execution.\n'
          )

          replace_once(
              'docs/COMMITTED_OPERATIONS_SCRIPTS.md',
              '- exist as a regular Git blob at the project\'s current `HEAD` commit;\n',
              '- exist as a regular Git blob at the selected commit; by default that is local `HEAD`, or callers may supply a full 40-character `commit` currently advertised by a branch head on the project\'s credential-free `github.com` `origin`;\n'
          )
          replace_once(
              'docs/COMMITTED_OPERATIONS_SCRIPTS.md',
              'Workbench resolves the full `HEAD` SHA, creates a disposable detached Git worktree at that exact commit, hashes the committed script, and executes:\n',
              'Workbench normally resolves the full local `HEAD` SHA. If `commit` is supplied, Workbench verifies the SHA is currently advertised by an `origin` branch head, fetches it into a separate disposable Git repository, and leaves the registered checkout untouched. It then creates a detached worktree at the selected commit, hashes the committed script, and executes:\n'
          )
          replace_once(
              'docs/COMMITTED_OPERATIONS_SCRIPTS.md',
              '- transport marker `git-worktree-bash`.\n',
              '- transport marker `git-worktree-bash` for local HEAD or `github-origin-commit-worktree-bash` for an exact advertised origin commit.\n'
          )
          PY
          gofmt -w cmd/workbench-relay/private_safe_hands.go
      - name: Verify remote-commit operations contract
        run: |
          set -euo pipefail
          git diff --check
          go test ./...
      - name: Commit prepared feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .workbench-remote-ops-commit.json .github/workflows/prepare-remote-ops-commit.yml
          git config user.name 'Workbench Feature Automation'
          git config user.email 'workbench-automation@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No feature wiring changes produced.' >&2; exit 1; }
          git commit -m 'Wire exact origin commits through operations relay'
          git push origin HEAD:feat/remote-commit-operations-scripts
