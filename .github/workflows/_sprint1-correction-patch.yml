name: sprint1-correction-patch-helper

on:
  push:
    branches:
      - sprint1-operational-telemetry-clean
    paths:
      - '.github/workflows/_sprint1-correction-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: sprint1-operational-telemetry-clean
      - name: Apply targeted Sprint 1 correction patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Truthful Workbench lifecycle stages when a provider cannot measure completion.
          replace_once('internal/core/work_item.go',
              'return WorkProgress{Kind: ProgressStages, Phase: "Selecting executor", Stage: 1, StageTotal: 4}',
              'return WorkProgress{Kind: ProgressStages, Phase: "Selecting executor", Stage: 1, StageTotal: 2}')
          replace_once('internal/core/work_item.go',
              'return WorkProgress{Kind: ProgressStages, Phase: phase, Stage: 2, StageTotal: 4}',
              'return WorkProgress{Kind: ProgressStages, Phase: phase, Stage: 2, StageTotal: 2}')
          replace_once('internal/core/scheduler_test.go',
              'if progress.Stage != 2 || progress.StageTotal != 4 {',
              'if progress.Stage != 2 || progress.StageTotal != 2 {')

          # Compact rows: readable state, project/task, real progress/stage, runtime/activity and priority.
          telemetry = 'internal/desktop/dashboard_operations_telemetry_windows.go'
          old_row = '''func operationsTelemetryListLine(item core.WorkItem, now time.Time) string {
\tproject := telemetryCompact(operationsProjectLabel(item), 18)
\ttitle := telemetryCompact(item.Title, 32)
\tstate := strings.ToUpper(string(item.State))
\tpriority := strings.ToUpper(item.Priority.String())
\tactivity := operationsActivityAge(item.UpdatedAt, now)

\tif item.State == core.TaskQueued {
\t\tqueue := priority
\t\tif item.QueuePosition > 0 {
\t\t\tqueue = fmt.Sprintf("#%d %s", item.QueuePosition, priority)
\t\t}
\t\treturn fmt.Sprintf("%s · %s — %s · %s · %s", queue, project, title, state, activity)
\t}
\tprogress := operationsTelemetryProgress(item.Progress, item.State)
\truntime := operationsTelemetryElapsed(item, now)
\treturn fmt.Sprintf("%s · %s — %s · %s · %s · %s · %s", state, project, title, progress, runtime, activity, priority)
}
'''
          new_row = '''func operationsTelemetryListLine(item core.WorkItem, now time.Time) string {
\tproject := telemetryCompact(operationsProjectLabel(item), 10)
\ttitle := telemetryCompact(item.Title, 28)
\tstate := operationsTelemetryState(item.State)
\tpriority := strings.ToUpper(item.Priority.String())
\ttask := project + "/" + title
\tactivity := operationsActivityAgeCompact(item.UpdatedAt, now)

\tif item.State == core.TaskQueued {
\t\tqueue := ""
\t\tif item.QueuePosition > 0 {
\t\t\tqueue = fmt.Sprintf(" #%d", item.QueuePosition)
\t\t}
\t\treturn fmt.Sprintf("%s%s · %s · %s · %s", state, queue, task, activity, priority)
\t}
\tprogress := operationsTelemetryCompactProgress(item.Progress, item.State)
\truntime := operationsTelemetryElapsedCompact(item, now)
\treturn fmt.Sprintf("%s · %s · %s · %s · %s · %s", state, task, progress, runtime, activity, priority)
}

func operationsTelemetryState(status core.TaskStatus) string {
\tswitch status {
\tcase core.TaskRunning:
\t\treturn "RUNNING"
\tcase core.TaskRouting:
\t\treturn "STARTING"
\tcase core.TaskQueued:
\t\treturn "QUEUED"
\tcase core.TaskWaitingDependency, core.TaskWaitingRetry:
\t\treturn "WAITING"
\tcase core.TaskNeedsAttention:
\t\treturn "NEEDS YOU"
\tcase core.TaskCompleted:
\t\treturn "COMPLETED"
\tcase core.TaskFailed:
\t\treturn "FAILED"
\tcase core.TaskCancelling:
\t\treturn "CANCELLING"
\tcase core.TaskCancelled:
\t\treturn "CANCELLED"
\tdefault:
\t\treturn strings.ToUpper(strings.ReplaceAll(string(status), "_", " "))
\t}
}

func operationsTelemetryCompactProgress(progress core.WorkProgress, status core.TaskStatus) string {
\tphase := telemetryCompact(strings.TrimSpace(progress.Phase), 12)
\tif phase == "" {
\t\tphase = telemetryCompact(operationsTelemetryState(status), 12)
\t}
\tswitch progress.Kind {
\tcase core.ProgressMeasured:
\t\tif progress.Total > 0 {
\t\t\tcurrent := progress.Current
\t\t\tif current < 0 {
\t\t\t\tcurrent = 0
\t\t\t}
\t\t\tif current > progress.Total {
\t\t\t\tcurrent = progress.Total
\t\t\t}
\t\t\tpercent := int((current * 100) / progress.Total)
\t\t\treturn fmt.Sprintf("%s %d%% %s", telemetryBar(percent, 6), percent, phase)
\t\t}
\tcase core.ProgressStages:
\t\tif progress.StageTotal > 0 && progress.Stage > 0 {
\t\t\tstage := progress.Stage
\t\t\tif stage > progress.StageTotal {
\t\t\t\tstage = progress.StageTotal
\t\t\t}
\t\t\tdots := strings.ReplaceAll(telemetryStageDots(stage, progress.StageTotal), " ", "")
\t\t\treturn fmt.Sprintf("Stage %d/%d %s %s", stage, progress.StageTotal, dots, phase)
\t\t}
\t}
\treturn phase
}

func operationsTelemetryElapsedCompact(item core.WorkItem, now time.Time) string {
\tif item.StartedAt == nil || item.StartedAt.IsZero() {
\t\treturn "elapsed —"
\t}
\treturn telemetryDuration(now.Sub(*item.StartedAt)) + " elapsed"
}

func operationsActivityAgeCompact(at, now time.Time) string {
\tif at.IsZero() {
\t\treturn "activity —"
\t}
\td := now.Sub(at)
\tif d < 0 {
\t\td = 0
\t}
\treturn telemetryDuration(d) + " ago"
}
'''
          replace_once(telemetry, old_row, new_row)
          replace_once(telemetry,
              'writeOperationsDetailLine(&b, "State", strings.ToUpper(string(item.State)))',
              'writeOperationsDetailLine(&b, "State", operationsTelemetryState(item.State))')
          replace_once(telemetry,
              'activity = strings.ToUpper(string(item.State))',
              'activity = operationsTelemetryState(item.State)')

          # Wire the canonical telemetry renderer immediately and widen compact lanes to 2 x 3.
          controls = 'internal/desktop/dashboard_operations_controls_windows.go'
          replace_once(controls,
              'setWindowText(s.controls[idOpsDetails], operationsDetailText(detail, time.Now()))',
              'setWindowText(s.controls[idOpsDetails], operationsTelemetryDetailText(detail, time.Now()))')
          old_compact = '''func operationsCompactListLine(item core.WorkItem) string {
\tproject := operationsProjectLabel(item)
\tphase := operationsProgressSummary(item.Progress, item.State)
\tif item.State == core.TaskQueued && item.QueuePosition > 0 {
\t\treturn fmt.Sprintf("#%d %s · %s — %s", item.QueuePosition, strings.ToUpper(item.Priority.String()), project, item.Title)
\t}
\treturn fmt.Sprintf("%s · %s — %s · %s", strings.ToUpper(dashboardStatusLabel(item.State, string(item.State))), project, item.Title, phase)
}

func operationsExpandedListLine(item core.WorkItem) string {
\tline := operationsCompactListLine(item)
\tworker := strings.TrimSpace(item.Provider)
\tif worker != "" {
\t\tline += " · " + worker
\t}
\treturn line
}
'''
          new_compact = '''func operationsCompactListLine(item core.WorkItem) string {
\treturn operationsTelemetryListLine(item, time.Now())
}

func operationsExpandedListLine(item core.WorkItem) string {
\treturn operationsTelemetryExpandedLine(item, time.Now())
}
'''
          replace_once(controls, old_compact, new_compact)
          replace_once(controls, 'if contentW < 850 || contentH < 620 {', 'if contentW < 720 || contentH < 560 {')
          replace_once(controls, 'resourceH := 164', 'resourceH := 132')
          old_grid = '''\tcolGap := 10
\trowGap := 10
\tcolW := (contentW - colGap*2) / 3
\trowH := (boardH - rowGap) / 2
\tfor i, control := range operationsLaneControls {
\t\tcol := i % 3
\t\trow := i / 3
\t\tx := contentX + col*(colW+colGap)
\t\ty := boardY + row*(rowH+rowGap)
\t\tshowWindow(s.controls[control.Header], true)
\t\tshowWindow(s.controls[control.List], true)
\t\tmoveWindow(s.controls[control.Header], x+8, y+5, colW-16, 30)
\t\tmoveWindow(s.controls[control.List], x+10, y+42, colW-20, rowH-50)
\t}
'''
          new_grid = '''\tcolGap := 10
\trowGap := 8
\tcolW := (contentW - colGap) / 2
\trowH := (boardH - rowGap*2) / 3
\tfor i, control := range operationsLaneControls {
\t\tcol := i % 2
\t\trow := i / 2
\t\tx := contentX + col*(colW+colGap)
\t\ty := boardY + row*(rowH+rowGap)
\t\tshowWindow(s.controls[control.Header], true)
\t\tshowWindow(s.controls[control.List], true)
\t\tmoveWindow(s.controls[control.Header], x+4, y+2, colW-8, 26)
\t\tmoveWindow(s.controls[control.List], x+6, y+32, colW-12, rowH-38)
\t}
'''
          replace_once(controls, old_grid, new_grid)

          # Focused UI expectations follow the concise row representation.
          tests = 'internal/desktop/dashboard_operations_telemetry_windows_test.go'
          replace_once(tests,
              '[]string{"RUNNING", "64%", "Verifying files", "elapsed 1m30s", "activity 8s ago", "HIGH"}',
              '[]string{"RUNNING", "64%", "Verifying fi…", "1m30s elapsed", "8s ago", "HIGH"}')
          replace_once(tests,
              '[]string{"Stage 3/5", "Executing", "elapsed 22s", "activity 2s ago", "NORMAL", "●", "○"}',
              '[]string{"Stage 3/5", "Executing", "22s elapsed", "2s ago", "NORMAL", "●", "○"}')
          replace_once(tests,
              'if !strings.Contains(line, "#1 CRITICAL") || !strings.Contains(line, "QUEUED") {',
              'if !strings.Contains(line, "QUEUED #1") || !strings.Contains(line, "CRITICAL") {')

          # New telemetry proof: parser fix, normal acceptance viewport, and truthful 2-stage fallback.
          wf = '.github/workflows/sprint1-operational-telemetry.yml'
          replace_once(wf, 'control $id: $($lines -join \' | \')', 'control ${id}: $($lines -join \' | \')')
          replace_once(wf, '[void][WBTelemetry]::MoveWindow($p.MainWindowHandle,10,10,1000,740,$true)', '[void][WBTelemetry]::MoveWindow($p.MainWindowHandle,10,10,1280,840,$true)')
          replace_once(wf, "-match 'Stage 2/4'", "-match 'Stage 2/2'")
          replace_once(wf, "if($after -notmatch 'elapsed \\d' -or $after -notmatch 'activity \\d')", "if($after -notmatch '\\d+s elapsed' -or $after -notmatch '\\d+s ago')")
          replace_once(wf, "if($serverRow -notmatch 'Stage 2/4' -or $serverRow -match '%')", "if($serverRow -notmatch 'Stage 2/2' -or $serverRow -match '%')")
          replace_once(wf, "Stage-only Server Ops displayed Stage 2/4 — Executing operation", "Stage-only Server Ops displayed Stage 2/2 — Executing operation")
          # UI title is intentionally compact; match a unique visible prefix while durable-state checks keep exact intent matching.
          replace_once(wf, "$priorityBefore=Row $ai 'Telemetry queued priority target'", "$priorityBefore=Row $ai 'Telemetry queued priority'")
          replace_once(wf, "Select-ListLine $p 3607 'Telemetry queued priority target'", "Select-ListLine $p 3607 'Telemetry queued priority'")
          replace_once(wf, "Wait-Until { (Row $ai 'Telemetry queued priority target') -match 'HIGH' }", "Wait-Until { (Row $ai 'Telemetry queued priority') -match 'HIGH' }")
          replace_once(wf, "$priorityAfter=Row $ai 'Telemetry queued priority target'", "$priorityAfter=Row $ai 'Telemetry queued priority'")

          # Existing Sprint 1 acceptances now assert the corrected user-facing telemetry contract.
          old = '.github/workflows/sprint1-operations-acceptance.yml'
          replace_once(old, "-match 'Normal priority'", "-match 'Priority: Normal'")
          replace_once(old, "-match 'High priority'", "-match 'Priority: High'")
          replace_once(old, "$_ -like '*WORKING*'", "$_ -like '*RUNNING*'")
          old_assert = '''if ($runningDetails -notmatch 'Assigned worker: structured-harness' -or $runningDetails -notmatch 'Start / elapsed:' -or $runningDetails -notmatch 'deterministic percentage unavailable') { throw "Running drill-down was incomplete: $runningDetails" }'''
          new_assert = '''if ($runningDetails -notmatch 'Assigned worker: structured-harness' -or $runningDetails -notmatch 'Started:' -or $runningDetails -notmatch 'Elapsed:' -or $runningDetails -notmatch 'Current stage: Executing worker' -or $runningDetails -notmatch 'Stage 2/2' -or $runningDetails -match 'percentage unavailable') { throw "Running drill-down was incomplete: $runningDetails" }'''
          replace_once(old, old_assert, new_assert)
          replace_once(old,
              "running drill-down exposed worker, start/elapsed and explicit indeterminate stage progress without a fabricated percentage",
              "running drill-down exposed worker, start/elapsed and truthful Stage 2/2 execution progress without a fabricated percentage")
          replace_once(old,
              "Select-ListLine $p 3611 'Approve acceptance deployment target'",
              "Select-ListLine $p 3611 'Approve acceptance'")

          live = '.github/workflows/sprint1-live-operations-integration.yml'
          replace_once(live, "-match 'Normal priority'", "-match 'Priority: Normal'")
          replace_once(live, "-match 'High priority'", "-match 'Priority: High'")
          old_live_assert = '''Wait-Until { (Get-BoundedText $details 'running target details') -match 'Implementing' -and (Get-BoundedText $details 'running target details') -match 'deterministic percentage unavailable' } 'open Dashboard to expose meaningful running stage' 10'''
          new_live_assert = '''Wait-Until { (Get-BoundedText $details 'running target details') -match 'Current stage: Executing worker' -and (Get-BoundedText $details 'running target details') -match 'Stage 2/2' -and (Get-BoundedText $details 'running target details') -notmatch 'percentage unavailable' } 'open Dashboard to expose meaningful running stage' 10'''
          replace_once(live, old_live_assert, new_live_assert)
          replace_once(live,
              'Running drill-down showed Implementing plus explicit deterministic-percentage-unavailable progress; no fake percent.',
              'Running drill-down showed truthful Stage 2/2 — Executing worker progress, elapsed runtime and no fake percent.')
          PY

          git config user.name 'Workbench CI'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/core internal/desktop .github/workflows
          git commit -m 'Make operational telemetry readable at a glance'
          git push origin HEAD:sprint1-operational-telemetry-clean
