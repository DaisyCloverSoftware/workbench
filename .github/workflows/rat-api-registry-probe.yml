name: RAT API registry probe

on:
  push:
    branches:
      - ops/rat-api-digest-repair-20260827

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact Sprint API image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='ghcr.io/daisycloversoftware/rum-api'
          tag='rat-candidate-9f946210bc70'
          source_sha='9f946210bc7053d043289107709010e8f88ee788'
          bad_digest='sha256:8f782a79666ea48cdced9187ea8ae1ce72d961fd2c9cea5e5f27f69660395930'
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect "$repo:$tag" | tee /tmp/inspect.txt
          index_digest="$(awk '/^Digest:/ {print $2; exit}' /tmp/inspect.txt)"
          docker buildx imagetools inspect --raw "$repo:$tag" > /tmp/manifest.json
          cat /tmp/manifest.json | jq .
          if jq -e '.manifests' /tmp/manifest.json >/dev/null 2>&1; then
            platform_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' /tmp/manifest.json | head -n1)"
          else
            platform_digest="$index_digest"
          fi
          echo "INDEX_DIGEST=$index_digest"
          echo "LINUX_AMD64_DIGEST=$platform_digest"
          if docker pull "$repo@$bad_digest"; then echo BAD_DIGEST_PULL=unexpected-success; else echo BAD_DIGEST_PULL=failed-as-expected; fi
          docker pull "$repo@$platform_digest"
          revision="$(docker inspect "$repo@$platform_digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "PULLED_REVISION=$revision"
          test "$revision" = "$source_sha"
