name: RAT Sprint 1 browser proof

on:
  push:
    branches:
      - ops/rat-s1-owner-review-proof-20260828

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture fresh Chromium evidence
        shell: bash
        env:
          RAT_URL: https://dev-rum-ra.daisycloversoftware.uk
          EXPECTED_SHA: 9f946210bc7053d043289107709010e8f88ee788
        run: |
          set -euo pipefail

          EVIDENCE="$RUNNER_TEMP/rat-browser-evidence"
          mkdir -p "$EVIDENCE"

          BROWSER=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$BROWSER"
          "$BROWSER" --version | tee "$EVIDENCE/browser-version.txt"

          curl -fsS --connect-timeout 10 --max-time 20 "$RAT_URL/" -o "$EVIDENCE/curl-index.html"
          curl -fsS --connect-timeout 10 --max-time 20 "$RAT_URL/VERSION" -o "$EVIDENCE/curl-version.txt"
          grep -Fq '<title>RAT — Rate A Thing</title>' "$EVIDENCE/curl-index.html"
          grep -Fq "$EXPECTED_SHA" "$EVIDENCE/curl-version.txt"

          python3 -m pip install --disable-pip-version-check --quiet selenium
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import tempfile

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["RAT_URL"].rstrip("/")
          expected_sha = os.environ["EXPECTED_SHA"]
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rat-browser-evidence"
          browser = next(
              (shutil.which(name) for name in ("google-chrome", "google-chrome-stable", "chromium", "chromium-browser") if shutil.which(name)),
              None,
          )
          if not browser:
              raise SystemExit("No Chromium-family browser found")

          profile = tempfile.mkdtemp(prefix="rat-s1-chrome-", dir=os.environ["RUNNER_TEMP"])
          options = Options()
          options.binary_location = browser
          options.page_load_strategy = "eager"
          for arg in (
              "--headless=new",
              "--no-sandbox",
              "--disable-gpu",
              "--disable-dev-shm-usage",
              "--incognito",
              "--window-size=1440,1800",
              f"--user-data-dir={profile}",
          ):
              options.add_argument(arg)

          driver = None
          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(30)
              driver.set_script_timeout(20)
              driver.set_window_size(1440, 1800)

              marker = "Rate A Thing — search anything. Find the right #thing# first."
              driver.get(url + "/")
              WebDriverWait(driver, 25).until(lambda d: marker in d.page_source)

              page_html = driver.page_source
              (evidence / "rat-home-desktop.dom.html").write_text(page_html, encoding="utf-8")
              (evidence / "page-title.txt").write_text(driver.title + "\n", encoding="utf-8")
              (evidence / "page-url.txt").write_text(driver.current_url + "\n", encoding="utf-8")
              if driver.title != "RAT — Rate A Thing":
                  raise AssertionError(f"Unexpected browser title: {driver.title!r}")

              expected_markers = (
                  "RUM RAT",
                  marker,
                  "Search a product, creator, company, video or place…",
                  "RAT searches Things and explicitly public personas. Private RUM people are never included.",
                  "/brand/rat-wordmark.webp",
                  "/brand/rum-thumb.webp",
                  "/brand/rat-pirate-mascot.webp",
              )
              missing = [value for value in expected_markers if value not in page_html]
              if missing:
                  raise AssertionError(f"Missing deployed RAT browser markers: {missing}")

              old_page_markers = (
                  "RUM Rate Anything",
                  "Search anything. Find the right thing first.",
                  "Find it. Understand it. Rate it.",
                  "One down. Five up. No stars.",
              )
              present_old = [value for value in old_page_markers if value in page_html]
              if present_old:
                  raise AssertionError(f"Obsolete Rate Anything page markers still rendered: {present_old}")

              if not driver.save_screenshot(str(evidence / "rat-home-desktop.png")):
                  raise RuntimeError("Failed to save desktop RAT screenshot")

              desktop_metrics = driver.execute_script(
                  "return {innerWidth: window.innerWidth, innerHeight: window.innerHeight, "
                  "scrollWidth: document.documentElement.scrollWidth, scrollHeight: document.documentElement.scrollHeight};"
              )
              (evidence / "desktop-metrics.json").write_text(json.dumps(desktop_metrics, indent=2) + "\n", encoding="utf-8")

              driver.execute_cdp_cmd("Emulation.setDeviceMetricsOverride", {
                  "width": 390,
                  "height": 844,
                  "deviceScaleFactor": 1,
                  "mobile": True,
              })
              driver.get(url + "/")
              WebDriverWait(driver, 25).until(lambda d: marker in d.page_source)
              mobile_html = driver.page_source
              (evidence / "rat-home-mobile-390.dom.html").write_text(mobile_html, encoding="utf-8")
              mobile_metrics = driver.execute_script(
                  "return {innerWidth: window.innerWidth, innerHeight: window.innerHeight, "
                  "scrollWidth: document.documentElement.scrollWidth, scrollHeight: document.documentElement.scrollHeight};"
              )
              (evidence / "mobile-390-metrics.json").write_text(json.dumps(mobile_metrics, indent=2) + "\n", encoding="utf-8")
              if int(mobile_metrics["innerWidth"]) != 390:
                  raise AssertionError(f"390px viewport emulation failed: {mobile_metrics}")
              if int(mobile_metrics["scrollWidth"]) > 390:
                  raise AssertionError(f"Horizontal overflow at 390px: {mobile_metrics}")
              if not driver.save_screenshot(str(evidence / "rat-home-mobile-390.png")):
                  raise RuntimeError("Failed to save 390px RAT screenshot")

              driver.execute_cdp_cmd("Emulation.clearDeviceMetricsOverride", {})
              driver.set_window_size(1440, 900)
              driver.get(url + "/VERSION")
              WebDriverWait(driver, 20).until(lambda d: expected_sha in d.page_source)
              version_html = driver.page_source
              (evidence / "version.dom.html").write_text(version_html, encoding="utf-8")
              (evidence / "version-url.txt").write_text(driver.current_url + "\n", encoding="utf-8")
              if not driver.save_screenshot(str(evidence / "version.png")):
                  raise RuntimeError("Failed to save /VERSION screenshot")

              screenshots = {
                  "desktop": evidence / "rat-home-desktop.png",
                  "mobile390": evidence / "rat-home-mobile-390.png",
                  "version": evidence / "version.png",
              }
              proof_lines = [
                  "RAT_BROWSER_PROOF_OK",
                  f"url={url}",
                  f"version={expected_sha}",
                  "browser_page_verified=true",
                  "old_unapproved_page_replaced=true",
                  "browser_version_verified=true",
                  "desktop_verified=true",
                  "mobile_390_verified=true",
              ]
              for label, path in screenshots.items():
                  proof_lines.append(f"{label}_screenshot_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
                  proof_lines.append(f"{label}_screenshot_bytes={path.stat().st_size}")
              proof = "\n".join(proof_lines) + "\n"
              (evidence / "proof.txt").write_text(proof, encoding="utf-8")
              print(proof, end="")
          except Exception as exc:
              if driver is not None:
                  try:
                      (evidence / "failure-current.dom.html").write_text(driver.page_source, encoding="utf-8")
                      driver.save_screenshot(str(evidence / "failure-current.png"))
                  except Exception:
                      pass
              (evidence / "browser-failure.txt").write_text(f"{type(exc).__name__}: {exc}\n", encoding="utf-8")
              raise
          finally:
              if driver is not None:
                  driver.quit()
              shutil.rmtree(profile, ignore_errors=True)
          PY

          {
            echo '## RAT Sprint 1 browser proof'
            echo
            echo '```text'
            cat "$EVIDENCE/proof.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rat-s1-browser-evidence
          path: ${{ runner.temp }}/rat-browser-evidence
          if-no-files-found: error
          retention-days: 14
