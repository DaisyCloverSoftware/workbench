name: Temporary Fascinvs Canonical Image Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/fascinvs/**'
      - '.github/workflows/fascinvs-canonical-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary build snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reconstruct and verify exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fascinvs-release /tmp/fascinvs-release.tar.gz
          mkdir -p /tmp/fascinvs-release
          cat release/fascinvs/part-*.b64 | base64 -d > /tmp/fascinvs-release.tar.gz
          echo '7938533ea4d2bf121f518c9642b0577d2dc3cebb80560d3f86fbdfb51ee00d18  /tmp/fascinvs-release.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fascinvs-release.tar.gz -C /tmp/fascinvs-release
          cd /tmp/fascinvs-release
          cat > /tmp/fascinvs-expected-blobs <<'EOF'
          118370b60eb212c45626aa569235eb9d7c99f33a .dockerignore
          9e35dd4e2e4ca19aea45fc352b390434b61d6041 .gitignore
          a700a1455970654fb486da93b96236c177151a4e Dockerfile
          3b093c5dee784659f626b7791c2cc0bce8cd7694 package.json
          261c33e8f71021db316609a93226f9db2915fa83 public/api.js
          90dcadc9f7dff9a70c5b473b079a1aff47d8b50c public/app.js
          3e6ebe25ec7f884256c011b1cbcfb05d20f07c58 public/compass.js
          3fcf48226d3d14e31dcff550c3e561bb00fe0290 public/fallback.js
          fce21ed2ac9dc87520bbfcf9e9cf3bab266afb03 public/geo.js
          72253ac4f6382d2d5f601f13cc49756a79f16340 public/glyph.js
          d5c3e96c83a69a20b6a14d8ecd58aba6219d121a public/index.html
          4147990cc5ff6047ff5063ba697e9b6bad7d2397 public/scene.js
          43d722f7ba70fb2cce01b09f2eb232240f0e011e public/style.css
          bdfc70e8af47344ff37e5f30a3acce2d8fd63aa8 public/ui.js
          aab9f19f989a082bf0c4465a819e8f88b169db47 public/xr.js
          e725bf1e38d79942e88d4a3b8f16b46d4440f168 scripts/vendor-three.js
          58535cbb10c1a8c96179eb0176fbcdb9b88f7fbb server.js
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "canonical blob mismatch: $path $actual != $expected" >&2; exit 1; }
          done < /tmp/fascinvs-expected-blobs

      - name: Build immutable image
        env:
          SOURCE_SHA: 4edde89707f0981571bfca970f7773c2469a1fbb
          IMAGE: ghcr.io/daisycloversoftware/fascinvs:4edde89707f0981571bfca970f7773c2469a1fbb
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/DaisyCloverSoftware/games" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            -t "$IMAGE" /tmp/fascinvs-release
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"

      - name: Container health smoke
        env:
          IMAGE: ghcr.io/daisycloversoftware/fascinvs:4edde89707f0981571bfca970f7773c2469a1fbb
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm "$IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          healthy=0
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            if [ "$status" = healthy ]; then healthy=1; break; fi
            if [ "$status" = unhealthy ]; then docker logs "$cid"; exit 1; fi
            sleep 2
          done
          test "$healthy" = 1
          docker exec "$cid" wget -q -O - http://127.0.0.1:8099/api/health | grep -F '"ok":true'

      - name: Publish immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/daisycloversoftware/fascinvs:4edde89707f0981571bfca970f7773c2469a1fbb
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
