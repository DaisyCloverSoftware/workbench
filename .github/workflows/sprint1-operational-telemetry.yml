name: sprint1-operational-telemetry

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - 'internal/desktop/**'
      - 'scripts/sprint1-operational-telemetry-live.ps1'
      - '.github/workflows/sprint1-operational-telemetry.yml'

permissions:
  contents: read

jobs:
  operational-telemetry:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - name: Run telemetry regression checks
        shell: pwsh
        run: go test ./...

      - name: Demonstrate live operational telemetry
        shell: pwsh
        run: ./scripts/sprint1-operational-telemetry-live.ps1

      - name: Upload Sprint 1 telemetry proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sprint1-Operational-Telemetry-Proof
          path: ${{ runner.temp }}/sprint1-telemetry-proof/*
          if-no-files-found: warn
